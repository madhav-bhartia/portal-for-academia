{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2 class="mb-3">Create an account</h2>
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    <form method="post" action="/signup">
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input class="form-control" name="name" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input class="form-control" type="email" name="email" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input class="form-control" type="password" name="password" required>
      </div>
      <div class="mb-3">
        <label class="form-label">I am a</label>
        <select class="form-select" name="role">
          {% for r in roles %}
            <option value="{{ r.value }}">{{ r.value }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Skills (students only, comma-separated)</label>
        <input class="form-control" name="skills" placeholder="python, sql, react">
      </div>
      <div class="mb-3">
        <label class="form-label">Company name (industry only)</label>
        <input class="form-control" name="company_name">
      </div>
      <button class="btn btn-primary" type="submit">Sign up</button>
    </form>
    <p class="mt-3">Already have an account? <a href="/login">Log in</a></p>
  </div>
</div>
{% endblock %}
